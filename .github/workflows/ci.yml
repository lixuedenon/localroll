# .github/workflows/ci.yml
# Analyze + test on every push, then build all three apps:
#   LocalRoll-Windows      zip with LocalRoll.exe and ffmpeg bundled
#   LocalRoll-Android      release APK (debug-signed, for testing)
#   LocalRoll-iOS-unsigned .ipa — sign & install with Sideloadly from Windows
# No Mac needed: the iOS build runs on GitHub's macOS runners.
name: CI

on:
  push:
    branches: [main]
    # A tag like v0.2.0 also publishes a GitHub Release for testers.
    tags: ['v*']
  pull_request:
  # Manual run from the Actions tab; fill "release" (e.g. v0.1.0-beta.2) to
  # also publish a GitHub Release for testers.
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish (empty = just build)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.4'
  IOS_FLUTTER_VERSION: '3.47.6'
  # Shown in both apps' settings: the release tag, or dev.<run> for test builds.
  LR_VERSION: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('dev.{0}', github.run_number) }}

jobs:
  # Generates the windows/ android/ ios/ folders with `flutter create` the first
  # time (they need a real Flutter SDK), patches permissions, commits them.
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.gen.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: gen
        name: Generate missing platform folders
        run: |
          created=false
          if [ ! -d apps/desktop/windows ]; then
            (cd apps/desktop && flutter create --no-pub --platforms=windows --org io.github.lixuedenon --project-name localroll_desktop .)
            created=true
          fi
          if [ ! -d apps/mobile/android ] || [ ! -d apps/mobile/ios ]; then
            (cd apps/mobile && flutter create --no-pub --platforms=android,ios --org io.github.lixuedenon --project-name localroll_mobile .)
            created=true
          fi
          python3 scripts/patch_platforms.py
          echo "created=$created" >> "$GITHUB_OUTPUT"
      - name: Commit platform folders
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: generate/patch platform folders (flutter create)"
            git push
          fi

  analyze:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: translations are complete and generated
        run: python3 scripts/gen_l10n.py --check
      - name: core — analyze & test
        working-directory: packages/core
        run: |
          set -o pipefail
          dart pub get
          dart analyze --fatal-warnings | tee ../../apps/analyze-core.log
          dart test 2>&1 | tee ../../apps/test-core.log
      - name: desktop — analyze & test
        working-directory: apps/desktop
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-infos | tee ../analyze-desktop.log
          flutter test 2>&1 | tee ../test-desktop.log
      - name: mobile — analyze & test
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-infos | tee ../analyze-mobile.log
          flutter test 2>&1 | tee ../test-mobile.log

      # The logs host isn't reachable from every tool; surface problems as annotations.
      - name: Report analyze/test errors
        if: failure()
        working-directory: apps
        run: |
          # A failing test's own lines (its name and the first lines of what
          # it printed), whatever the error looks like.
          for f in test-*.log; do
            [ -f "$f" ] || continue
            grep -n -A14 "\[E\]$" "$f" | grep -v "package:\(test_api\|stack_trace\|matcher\|flutter_test\)" | head -45 | tr '\n' '\r' | sed 's/\r/ ⏎ /g' | fold -w 900 | head -8 | while IFS= read -r l; do echo "::error::$f context: $l"; done
          done
          for f in analyze-*.log test-*.log; do
            [ -f "$f" ] || continue
            grep -E "error •|warning •|error - |warning - |Error:|FAILED|Expected:|Actual:|Which:|\[E\]|Exception|Bad state|test/.*_test\.dart [0-9]+:[0-9]+" "$f" | grep -v "^\s*package:" | head -40 | while IFS= read -r l; do echo "::error::$f ${l:0:800}"; done
          done

  build-windows:
    needs: analyze
    # Flutter 3.35 only generates for VS 2022; windows-latest now ships VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --dart-define=LR_VERSION="$LR_VERSION" -v 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: apps/desktop
        shell: bash
        run: |
          grep -iE "error|fatal|exception|failed" build.log | grep -viE "warning|0 error" | tail -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Check onnxruntime.dll
        shell: pwsh
        run: |
          # Picture search: must be Microsoft's official onnxruntime 1.15.1 (win-x64), unchanged.
          $dll = "apps/desktop/build/windows/x64/runner/Release/onnxruntime.dll"
          if (-not (Test-Path $dll)) { Write-Output "::error::onnxruntime.dll missing from the build"; exit 1 }
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "bb090dd258282c1d7f7a41a83492ba07bc4fe65d75259435587350e1fa66f1bc") { Write-Output "::error::onnxruntime.dll SHA-256 $sha is not the official 1.15.1"; exit 1 }
      - name: Bundle the face models
        shell: pwsh
        run: |
          # "People": YuNet (MIT) finds faces, SFace (Apache 2.0) reads them.
          # Copied into the "deps" release by faces.yml; checked here.
          $models = "apps/desktop/build/windows/x64/runner/Release/models"
          New-Item -ItemType Directory -Force -Path $models | Out-Null
          $want = @{
            "face-detect.onnx" = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4";
            "face-id.onnx" = "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
          }
          foreach ($name in $want.Keys) {
            Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/deps/$name" -OutFile "$models/$name"
            $sha = (Get-FileHash "$models/$name" -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $want[$name]) { Write-Output "::error::$name SHA-256 $sha does not match"; exit 1 }
          }
      - name: Check the face models load
        working-directory: apps/desktop
        shell: pwsh
        run: |
          # Through onnxruntime.dll, the way the app runs them (a model that
          # can't be opened failed silently on a real PC once).
          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          $env:PATH = "$release;$env:PATH"
          $env:LR_MODELS_DIR = "$release\models"
          flutter test test/models_load_test.dart 2>&1 | Tee-Object -FilePath models.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content models.log | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 9 | ForEach-Object {
              $l = $_; if ($l.Length -gt 900) { $l = $l.Substring(0, 900) }; Write-Output "::error::$l"
            }
            exit 1
          }
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          $release = "apps/desktop/build/windows/x64/runner/Release"
          # The pinned copy (scripts/ffmpeg-pin.env, made by pin-deps.yml),
          # checked against its SHA-256. Before the first pin: upstream's
          # newest, with a warning.
          $pin = @{}
          if (Test-Path scripts/ffmpeg-pin.env) {
            Get-Content scripts/ffmpeg-pin.env | Where-Object { $_ -match '^([A-Z0-9_]+)=(.*)$' } | ForEach-Object { $pin[$Matches[1]] = $Matches[2].Trim('"') }
          }
          if ($pin['FFMPEG_ASSET'] -and $pin['FFMPEG_SHA256']) {
            Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/deps/$($pin['FFMPEG_ASSET'])" -OutFile ffmpeg.zip
            $sha = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $pin['FFMPEG_SHA256'].ToLower()) { Write-Output "::error::ffmpeg.zip SHA-256 $sha does not match the pin"; exit 1 }
            Write-Output "::notice::ffmpeg: $($pin['FFMPEG_FROM'])"
          } else {
            Write-Output "::warning::ffmpeg not pinned yet (run 'Pin dependencies'); using upstream's newest"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = Get-ChildItem -Path ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$release/ffmpeg" | Out-Null
          Copy-Item $bin.FullName "$release/ffmpeg/"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "$release/ffmpeg/"
          Rename-Item "$release/localroll_desktop.exe" "LocalRoll.exe" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRoll-Windows
          path: apps/desktop/build/windows/x64/runner/Release

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        working-directory: apps/mobile
        env:
          LR_KEYSTORE_B64: ${{ secrets.LR_KEYSTORE_B64 }}
          LR_KEYSTORE_PASSWORD: ${{ secrets.LR_KEYSTORE_PASSWORD }}
          LR_KEY_ALIAS: ${{ secrets.LR_KEY_ALIAS }}
          LR_KEY_PASSWORD: ${{ secrets.LR_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # Same signing key every build: updates install over the old app.
          if [ -n "$LR_KEYSTORE_B64" ]; then
            echo "$LR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/localroll.jks"
            export LR_KEYSTORE_PATH="$RUNNER_TEMP/localroll.jks"
          fi
          flutter build apk --release --dart-define=LR_VERSION="$LR_VERSION" 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: apps/mobile
        run: grep -iE "error|exception|failed" build.log | tail -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRoll-Android
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      # iOS needs Flutter >= 3.38 for the UIScene lifecycle (iOS 26 permission prompts).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.IOS_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (no code signing)
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define=LR_VERSION="$LR_VERSION" 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: apps/mobile
        run: |
          # GitHub shows at most 10 notes per step: the last ~9000 characters
          # of the build output, in pieces (Xcode's real error is in there).
          grep -E "Error \(Xcode\)|error:|requires a development team|Signing for" build.log | head -5 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          tail -c 4500 build.log | tr '\n' ' ' | fold -w 900 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Package unsigned IPA
        working-directory: apps/mobile/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr LocalRoll-unsigned.ipa Payload
          # Diagnostics (visible as annotations): bundle size and embedded plugin frameworks.
          echo "::notice::ipa $(du -h LocalRoll-unsigned.ipa | cut -f1), Runner.app $(du -sh Runner.app | cut -f1)"
          echo "::notice::Frameworks: $(ls Runner.app/Frameworks | tr '\n' ' ')"
          echo "::notice::Plist keys: $(/usr/libexec/PlistBuddy -c Print Runner.app/Info.plist | grep -oE 'NS[A-Za-z]+UsageDescription' | sort -u | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRoll-iOS-unsigned
          path: apps/mobile/build/ios/iphoneos/LocalRoll-unsigned.ipa

  # Tag push (v*) → GitHub Release with the three downloads for testers.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          (cd LocalRoll-Windows && zip -qr ../LocalRoll-Windows.zip .)
          mv LocalRoll-Android/app-release.apk LocalRoll-Android.apk
          mv LocalRoll-iOS-unsigned/LocalRoll-unsigned.ipa LocalRoll-iOS-unsigned.ipa
          ls -la
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## 下载 / Downloads

          - **Windows**：下载 `LocalRoll-Windows.zip`，解压到一个文件夹，运行 `LocalRoll.exe`。
            Windows 若提示"已保护你的电脑"，点「更多信息」→「仍要运行」（测试版尚未签名）。
          - **Android**：在手机上下载 `LocalRoll-Android.apk` 并安装（需要允许"安装未知应用"）。
          - **iPhone**：`LocalRoll-iOS-unsigned.ipa` 需要用 Sideloadly 和自己的 Apple ID 安装（7 天有效）。
            正式给朋友测试请等 TestFlight 版本。

          电脑和手机连同一个 Wi-Fi，手机打开 LocalRoll →「连接电脑」→ 点电脑名字 → 电脑上点「允许」。
          NOTES
          gh release create "${TAG}" -R "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "LocalRoll ${TAG}" --notes-file notes.md --latest \
            dist/LocalRoll-Windows.zip dist/LocalRoll-Android.apk dist/LocalRoll-iOS-unsigned.ipa
