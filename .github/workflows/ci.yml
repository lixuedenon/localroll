# .github/workflows/ci.yml
# Analyze + test on every push, then build all three apps:
#   LocalRoll-Windows      zip with LocalRoll.exe and ffmpeg bundled
#   LocalRoll-Android      release APK (debug-signed, for testing)
#   LocalRoll-iOS-unsigned .ipa — sign & install with Sideloadly from Windows
# No Mac needed: the iOS build runs on GitHub's macOS runners.
name: CI

on:
  push:
    branches: [main]
    # A tag like v0.2.0 also publishes a GitHub Release for testers.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.4'
  IOS_FLUTTER_VERSION: '3.47.6'

jobs:
  # Generates the windows/ android/ ios/ folders with `flutter create` the first
  # time (they need a real Flutter SDK), patches permissions, commits them.
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.gen.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: gen
        name: Generate missing platform folders
        run: |
          created=false
          if [ ! -d apps/desktop/windows ]; then
            (cd apps/desktop && flutter create --no-pub --platforms=windows --org io.github.lixuedenon --project-name localroll_desktop .)
            created=true
          fi
          if [ ! -d apps/mobile/android ] || [ ! -d apps/mobile/ios ]; then
            (cd apps/mobile && flutter create --no-pub --platforms=android,ios --org io.github.lixuedenon --project-name localroll_mobile .)
            created=true
          fi
          python3 scripts/patch_platforms.py
          echo "created=$created" >> "$GITHUB_OUTPUT"
      - name: Commit platform folders
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: generate/patch platform folders (flutter create)"
            git push
          fi

  analyze:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: translations are complete and generated
        run: python3 scripts/gen_l10n.py --check
      - name: core — analyze & test
        working-directory: packages/core
        run: |
          dart pub get
          dart analyze --fatal-warnings
          dart test
      - name: desktop — analyze & test
        working-directory: apps/desktop
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-infos | tee ../analyze-desktop.log
          flutter test 2>&1 | tee ../test-desktop.log
      - name: mobile — analyze & test
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-infos | tee ../analyze-mobile.log
          flutter test 2>&1 | tee ../test-mobile.log

      # The logs host isn't reachable from every tool; surface problems as annotations.
      - name: Report analyze/test errors
        if: failure()
        working-directory: apps
        run: |
          for f in analyze-*.log test-*.log; do
            [ -f "$f" ] || continue
            grep -E "error •|warning •|Error:|FAILED|Expected:|Actual:" "$f" | head -30 | while IFS= read -r l; do echo "::error::$f ${l:0:800}"; done
          done

  build-windows:
    needs: analyze
    # Flutter 3.35 only generates for VS 2022; windows-latest now ships VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: apps/desktop
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release -v 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: apps/desktop
        shell: bash
        run: |
          grep -iE "error|fatal|exception|failed" build.log | grep -viE "warning|0 error" | tail -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          $release = "apps/desktop/build/windows/x64/runner/Release"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = Get-ChildItem -Path ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$release/ffmpeg" | Out-Null
          Copy-Item $bin.FullName "$release/ffmpeg/"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "$release/ffmpeg/"
          Rename-Item "$release/localroll_desktop.exe" "LocalRoll.exe" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRoll-Windows
          path: apps/desktop/build/windows/x64/runner/Release

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: apps/mobile
        run: grep -iE "error|exception|failed" build.log | tail -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRoll-Android
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      # iOS needs Flutter >= 3.38 for the UIScene lifecycle (iOS 26 permission prompts).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.IOS_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (no code signing)
        working-directory: apps/mobile
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        working-directory: apps/mobile
        run: grep -iE "error|exception|failed" build.log | tail -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
      - name: Package unsigned IPA
        working-directory: apps/mobile/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr LocalRoll-unsigned.ipa Payload
          # Diagnostics (visible as annotations): bundle size and embedded plugin frameworks.
          echo "::notice::ipa $(du -h LocalRoll-unsigned.ipa | cut -f1), Runner.app $(du -sh Runner.app | cut -f1)"
          echo "::notice::Frameworks: $(ls Runner.app/Frameworks | tr '\n' ' ')"
          echo "::notice::Plist keys: $(/usr/libexec/PlistBuddy -c Print Runner.app/Info.plist | grep -oE 'NS[A-Za-z]+UsageDescription' | sort -u | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalRoll-iOS-unsigned
          path: apps/mobile/build/ios/iphoneos/LocalRoll-unsigned.ipa

  # Tag push (v*) → GitHub Release with the three downloads for testers.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          (cd LocalRoll-Windows && zip -qr ../LocalRoll-Windows.zip .)
          mv LocalRoll-Android/app-release.apk LocalRoll-Android.apk
          mv LocalRoll-iOS-unsigned/LocalRoll-unsigned.ipa LocalRoll-iOS-unsigned.ipa
          ls -la
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## 下载 / Downloads

          - **Windows**：下载 `LocalRoll-Windows.zip`，解压到一个文件夹，运行 `LocalRoll.exe`。
            Windows 若提示"已保护你的电脑"，点「更多信息」→「仍要运行」（测试版尚未签名）。
          - **Android**：在手机上下载 `LocalRoll-Android.apk` 并安装（需要允许"安装未知应用"）。
          - **iPhone**：`LocalRoll-iOS-unsigned.ipa` 需要用 Sideloadly 和自己的 Apple ID 安装（7 天有效）。
            正式给朋友测试请等 TestFlight 版本。

          电脑和手机连同一个 Wi-Fi，手机打开 LocalRoll →「连接电脑」→ 点电脑名字 → 电脑上点「允许」。
          NOTES
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --title "LocalRoll ${GITHUB_REF_NAME}" --notes-file notes.md --prerelease \
            dist/LocalRoll-Windows.zip dist/LocalRoll-Android.apk dist/LocalRoll-iOS-unsigned.ipa
