# apps/desktop/pubspec.yaml
name: localroll_desktop
description: LocalRoll for Windows — receive photos/videos from phones over the LAN, view, play and convert them.
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Version is pinned by flutter_localizations.
  intl: any
  localroll_core:
    path: ../../packages/core

  # Video playback (libmpv): plays HEVC / HDR / Dolby Vision originals directly.
  media_kit: '>=1.1.10 <2.0.0'
  media_kit_video: '>=1.2.3 <3.0.0'
  media_kit_libs_video: '>=1.0.5 <2.0.0'

  # mDNS advertisement so phones find this PC without scanning a QR code.
  # 5.x needs Flutter 3.41+, so stay on 4.x for now.
  nsd: '>=4.0.0 <5.0.0'

  path_provider: ^2.1.4
  # Finding a file's annotations by its contents (BSD).
  crypto: ^3.0.3
  # Photos / videos dragged from Explorer open in the player (Apache 2.0).
  # 0.9 needs a newer Flutter than the one used for Windows here.
  desktop_drop: '>=0.8.0 <0.9.0'
  # Choosing a picture for this PC's badge.
  file_selector: ^1.0.3
  # Custom title bar (Back / Exit, confirm before closing).
  window_manager: '>=0.4.3 <0.6.0'
  qr_flutter: ^4.1.0
  # HTTPS: this PC's own self-signed certificate (made once, pinned by phones).
  basic_utils: ^5.7.0
  # Windows DPAPI (tokens for other PCs sealed per user).
  ffi: ^2.1.0
  # Reading PDFs (scans, documents) inside LocalRoll. 1.x builds with the
  # Flutter used for Windows here (2.x needs a newer one).
  pdfrx: '>=1.0.100 <2.0.0'
  # Picture search: runs the picture model on this PC (MIT; ships Microsoft's
  # onnxruntime.dll 1.15.1 unchanged — CI checks its SHA-256).
  onnxruntime: 1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  uses-material-design: true
