# apps/mobile/pubspec.yaml
name: localroll_mobile
description: LocalRoll for iPhone and Android — send original photos and videos to your PC over Wi-Fi.
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Version is pinned by flutter_localizations.
  intl: any
  localroll_core:
    path: ../../packages/core

  # Reads ORIGINAL files straight from the photo library (no transcoding,
  # no waiting like Safari's file picker).
  photo_manager: '>=3.6.0 <4.0.0'

  # Finds the PC on the LAN via Bonjour/mDNS. 5.x needs Flutter 3.41+.
  nsd: '>=4.0.0 <5.0.0'

  # QR pairing (Apple Vision on iOS, ML Kit on Android).
  mobile_scanner: '>=7.0.0 <8.0.0'

  # Keep the screen on during long transfers.
  wakelock_plus: '>=1.2.0 <2.0.0'
  shared_preferences: ^2.2.0
  # App-support folder for the per-PC "already sent" lists.
  path_provider: ^2.1.0
  # Pairing tokens and the phone's id in the Keychain / Android Keystore.
  flutter_secure_storage: ^9.2.2
  # This phone's own HTTPS certificate (receiving from other phones).
  basic_utils: ^5.7.0
  # Playing videos from the PC's library (through a local relay).
  video_player: ^2.9.2
  # Scanning paper: the phone's own scanner (VisionKit / ML Kit), pages
  # made into one PDF here.
  cunning_document_scanner: '>=1.2.3 <3.0.0'
  # Android phones without Google Play services have no system scanner:
  # pages are then taken as plain photos with the camera.
  image_picker: '>=1.1.2 <1.3.0'
  # 4.6+ needs a newer zip library than other plugins allow here.
  image: '>=4.3.0 <4.6.0'
  pdf: ^3.11.0
  # Reading PDFs in "My files" (2.x needs a newer Flutter than Android builds with).
  pdfrx: '>=1.0.100 <2.0.0'
  # Share sheet (mail, messages, print…) and picking any file to send.
  share_plus: '>=11.0.0 <12.0.0'
  file_picker: '>=8.1.0 <11.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  uses-material-design: true
